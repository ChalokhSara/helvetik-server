# Environnement de développement.
#
# Compose applique ce fichier automatiquement : `docker compose up -d` suffit.
# Rien de ce qui est ici ne doit se retrouver en production.

services:
  api:
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Secret de développement assumé : il est public et sans valeur.
      - SESSION_SECRET=dev-only-secret
      # Les emails partent dans Mailpit et ne sortent jamais de la machine.
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - EMAIL_CONFIRMATION_REQUIRED=${EMAIL_CONFIRMATION_REQUIRED:-false}
      # APP_BASE_URL volontairement absent : les liens des emails sont déduits
      # de l'adresse par laquelle le visiteur est arrivé. Un compte créé depuis
      # un téléphone sur http://192.168.1.x:3000 reçoit donc un lien cliquable
      # depuis ce téléphone.
    depends_on:
      - mongodb
      - mailpit

  mongodb:
    ports:
      - "27017:27017"

  # Serveur SMTP de développement : capture tous les emails sans jamais les
  # transmettre à l'extérieur. Interface web sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # interface web + API REST
    environment:
      - MP_MAX_MESSAGES=500
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    networks:
      - app-network
