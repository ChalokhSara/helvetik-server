# Environnement de production.
#
#   docker compose up -d --build
#   (avec COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml dans .env)
#
# Les valeurs viennent du fichier `.env` placé à la racine du dépôt (voir
# .env.example). Compose refuse de démarrer si une variable obligatoire manque,
# ce qui vaut mieux qu'un service qui tourne à moitié configuré.

services:
  api:
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production

      # Sans secret propre, l'application refuse de démarrer : un cookie de
      # session forgé donnerait accès à n'importe quel compte.
      - SESSION_SECRET=${SESSION_SECRET:?definir SESSION_SECRET dans .env}

      # Adresse publique du service. Elle fait autorité pour les liens envoyés
      # par email : en production, l'en-tête Host de la requête est fourni par
      # le client et ne peut donc pas servir de référence.
      - APP_BASE_URL=${APP_BASE_URL:?definir APP_BASE_URL dans .env}

      # Par défaut, le relais Postfix du service `mailer` ci-dessous, joint sur
      # le réseau interne : ni TLS ni authentification, le trafic ne sort pas
      # de Docker. Renseigner SMTP_HOST dans .env bascule sur un relais externe.
      - SMTP_HOST=${SMTP_HOST:-mailer}
      - SMTP_PORT=${SMTP_PORT:-25}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      # Le relais interne présente un certificat auto-signé : inutile de
      # chiffrer un trafic qui ne quitte pas le réseau Docker. À passer à
      # false dès que SMTP_HOST désigne un relais accessible par Internet.
      - SMTP_IGNORE_TLS=${SMTP_IGNORE_TLS:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}

      # Derrière un reverse proxy terminant TLS, pour que req.protocol vaille
      # « https » et que les cookies soient bien marqués Secure.
      # Confirmation d'email : désactivée le temps de la phase de mesure.
      # Remettre à true rétablit le parcours complet, sans autre changement.
      - EMAIL_CONFIRMATION_REQUIRED=${EMAIL_CONFIRMATION_REQUIRED:-false}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - APP_ALLOWED_HOSTS=${APP_ALLOWED_HOSTS:-}
    depends_on:
      - mongodb
      - mailer

  # Relais SMTP sortant.
  #
  # Il expédie réellement les messages, sans dépendre d'un service tiers. En
  # contrepartie, la délivrabilité dépend entièrement de la réputation du
  # serveur : sans enregistrement PTR ni SPF, une partie des destinataires
  # classera les messages en indésirables, voire les refusera. La page de
  # confirmation d'inscription invite donc à regarder dans les spams.
  #
  # Deux conditions matérielles, à vérifier avant de s'étonner :
  #   - le port 25 sortant doit être ouvert par l'hébergeur (souvent bloqué) ;
  #   - le domaine doit avoir un SPF autorisant l'IP du serveur.
  mailer:
    image: boky/postfix:latest
    restart: unless-stopped
    environment:
      # Domaines pour lesquels le relais accepte d'expédier.
      - ALLOWED_SENDER_DOMAINS=${MAIL_DOMAIN:?definir MAIL_DOMAIN dans .env}
      # Nom annoncé au serveur distant : il doit correspondre au PTR de l'IP.
      - POSTFIX_myhostname=${MAIL_HOSTNAME:-${MAIL_DOMAIN}}
      # Signature DKIM : la paire de clés est générée au premier démarrage et
      # conservée dans le volume. Sans l'enregistrement DNS correspondant
      # (voir le README), la signature ne sert à rien : Gmail et Outlook
      # exigent que la clé publique soit publiée.
      - DKIM_AUTOGENERATE=1
      - DKIM_SELECTOR=mail
    volumes:
      - dkim_keys:/etc/opendkim/keys
    networks:
      - app-network

volumes:
  dkim_keys:
