version: '3.8'

services:
  # Service API
  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/insurance-app
      - KEYCLOAK_URL=http://localhost:8080
      - NODE_ENV=development
      - KEYCLOAK_REALM=Helvetik
      - KEYCLOAK_CLIENT_ID=helvetik-backend
      - KEYCLOAK_CLIENT_SECRET=V38eARml7be7H3lK8YOBW57B21UQRcOt
    depends_on:
      - mongodb
      - keycloak
    networks:
      - app-network

  # Base de données MongoDB
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  # Serveur Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=password
      - KC_HOSTNAME=localhost
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    command: start-dev
    networks:
      - app-network

  # Base de données PostgreSQL pour Keycloak
  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  mongodb_data:
  postgres_data:

networks:
  app-network:
    driver: bridge 