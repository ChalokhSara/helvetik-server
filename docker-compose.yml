services:
  # Service API
  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/insurance-app
      - NODE_ENV=development
      - SESSION_SECRET=dev-only-secret
      - ROOT_ADMIN_EMAIL=root@helvetik.local
      - APP_BASE_URL=http://localhost:3000
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - MAIL_FROM=Helvetik <no-reply@helvetik.local>
      - NOTIFICATIONS_ENABLED=true
      - NOTIFICATIONS_CRON=0 8 * * *
      - NOTIFICATIONS_RUN_ON_START=false
      - TZ=Europe/Zurich
      - PREMIUM_SYNC_ENABLED=true
      - PREMIUM_SYNC_CRON=0 4 1 * *
    depends_on:
      - mongodb
      - mailpit
    networks:
      - app-network

  # Base de données MongoDB
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  # Serveur SMTP de développement : capture tous les emails sans jamais les
  # transmettre à l'extérieur. Interface web sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # interface web + API REST
    environment:
      - MP_MAX_MESSAGES=500
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
